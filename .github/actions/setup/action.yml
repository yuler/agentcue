name: Setup toolchain
description: Set up Node.js, mise/Bun, and optionally cache and install workspace dependencies

inputs:
  install:
    description: Whether to cache and install dependencies via bun install --frozen-lockfile
    required: false
    default: "true"
  registry-url:
    description: Optional npm registry URL for actions/setup-node
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        registry-url: ${{ inputs.registry-url }}

    - name: Setup mise & Bun
      uses: jdx/mise-action@v2

    - name: Cache Bun dependencies
      if: inputs.install == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: bun install --frozen-lockfile
