name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Mirrors `mise run check` (build + test) without installing mise/Node.
      - name: Build all targets
        run: |
          (cd packages/agentcue && bun scripts/build.mjs)
          (cd apps/web && bun scripts/build.mjs)
          (cd examples/vite-react && bunx tsc --noEmit && bunx vite build)

      - name: Run test suite
        run: (cd packages/agentcue && bun test)

      - name: Verify package tarball
        working-directory: packages/agentcue
        run: bun pm pack --dry-run
