name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: ${{ github.event_name == 'push' && 0 || 1 }}

      - name: Detect changed scopes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            agentcue:
              - 'packages/agentcue/**'
              - 'examples/html/index.html'
              - 'scripts/resolve-version.mjs'
              - 'README.md'
              - 'LICENSE'
              - 'logo.svg'
              - 'logo-dark.svg'
              - 'package.json'
              - 'bun.lock'
              - 'tsconfig.base.json'
              - 'mise.toml'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            extension:
              - 'packages/extension/**'
              - 'packages/agentcue/src/client/**'
              - 'packages/agentcue/src/shared/**'
              - 'packages/agentcue/src/server/**'
              - 'scripts/resolve-version.mjs'
              - 'package.json'
              - 'bun.lock'
              - 'tsconfig.base.json'
              - 'mise.toml'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            web:
              - 'apps/web/**'
              - 'packages/extension/**'
              - 'packages/agentcue/src/client/**'
              - 'packages/agentcue/src/shared/**'
              - 'packages/agentcue/scripts/build.mjs'
              - 'packages/agentcue/package.json'
              - 'scripts/resolve-version.mjs'
              - 'logo.svg'
              - 'package.json'
              - 'bun.lock'
              - 'tsconfig.base.json'
              - 'mise.toml'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            example_vite_react:
              - 'examples/vite-react/**'
              - 'packages/agentcue/src/index.ts'
              - 'packages/agentcue/src/vite.ts'
              - 'packages/agentcue/src/server/**'
              - 'packages/agentcue/src/shared/**'
              - 'packages/agentcue/src/client/**'
              - 'packages/agentcue/scripts/build.mjs'
              - 'packages/agentcue/package.json'
              - 'packages/agentcue/tsconfig*.json'
              - 'scripts/resolve-version.mjs'
              - 'package.json'
              - 'bun.lock'
              - 'tsconfig.base.json'
              - 'mise.toml'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'

      - name: Setup toolchain
        if: >-
          steps.changes.outputs.agentcue == 'true' ||
          steps.changes.outputs.extension == 'true' ||
          steps.changes.outputs.web == 'true' ||
          steps.changes.outputs.example_vite_react == 'true'
        uses: ./.github/actions/setup
        with:
          install: >-
            ${{
              steps.changes.outputs.agentcue == 'true' ||
              steps.changes.outputs.extension == 'true' ||
              steps.changes.outputs.example_vite_react == 'true'
            }}

      - name: Build and test affected targets
        if: >-
          steps.changes.outputs.agentcue == 'true' ||
          steps.changes.outputs.extension == 'true' ||
          steps.changes.outputs.web == 'true' ||
          steps.changes.outputs.example_vite_react == 'true'
        run: |
          tasks=()
          [ "${{ steps.changes.outputs.agentcue }}" = "true" ] && tasks+=(agentcue:test)
          [ "${{ steps.changes.outputs.extension }}" = "true" ] && tasks+=(extension:test)
          [ "${{ steps.changes.outputs.web }}" = "true" ] && tasks+=(web:build)
          [ "${{ steps.changes.outputs.example_vite_react }}" = "true" ] && tasks+=(example:vite-react:build)

          args=()
          for t in "${tasks[@]}"; do
            [ ${#args[@]} -gt 0 ] && args+=(:::)
            args+=("$t")
          done
          mise run "${args[@]}"

      - name: Verify package tarball
        if: steps.changes.outputs.agentcue == 'true'
        working-directory: packages/agentcue
        run: bun pm pack --dry-run
