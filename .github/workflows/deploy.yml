name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "packages/extension/**"
      - "packages/agentcue/src/client/**"
      - "packages/agentcue/src/shared/**"
      - "packages/agentcue/scripts/build.mjs"
      - "packages/agentcue/package.json"
      - "logo.svg"
      - "package.json"
      - "bun.lock"
      - "mise.toml"
      - "tsconfig.base.json"
      - ".github/workflows/deploy.yml"
      - ".github/actions/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build Web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Setup toolchain
        uses: ./.github/actions/setup
        with:
          install: "false"

      - name: Build @agentcue/web
        run: mise run web:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./apps/web/dist

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
