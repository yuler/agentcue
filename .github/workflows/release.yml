name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump when package is already published on npm"
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Publish agentcue
    if: ${{ !(github.event_name == 'push' && contains(github.event.head_commit.message, '[skip release]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve release version
        id: version
        env:
          INPUT_BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          bun - <<'EOF'
          import { appendFileSync, copyFileSync, readFileSync, writeFileSync } from "node:fs";
          import { execFileSync } from "node:child_process";

          const pkgPath = "packages/agentcue/package.json";
          const pkg = JSON.parse(readFileSync(pkgPath, "utf8"));
          const pkgName = pkg.name;
          const bump = process.env.INPUT_BUMP || "patch";
          const eventName = process.env.GITHUB_EVENT_NAME || "push";

          function parseSemver(v) {
            const m = /^v?(\d+)\.(\d+)\.(\d+)$/.exec(String(v || "").trim());
            return m ? [Number(m[1]), Number(m[2]), Number(m[3])] : null;
          }

          function cmpSemver(a, b) {
            for (let i = 0; i < 3; i++) {
              if (a[i] !== b[i]) return a[i] - b[i];
            }
            return 0;
          }

          function fmtSemver([maj, min, pat]) {
            return `${maj}.${min}.${pat}`;
          }

          function bumpSemver([maj, min, pat], kind) {
            if (kind === "major") return [maj + 1, 0, 0];
            if (kind === "minor") return [maj, min + 1, 0];
            return [maj, min, pat + 1];
          }

          const res = await fetch(`https://registry.npmjs.org/${encodeURIComponent(pkgName)}`, {
            headers: { Accept: "application/json", "Cache-Control": "no-cache" },
          });

          const npmVersions = new Set();
          let npmLatest = null;

          if (res.status === 200) {
            const data = await res.json();
            for (const v of Object.keys(data.versions || {})) {
              const parsed = parseSemver(v);
              if (parsed) {
                npmVersions.add(fmtSemver(parsed));
                if (!npmLatest || cmpSemver(parsed, npmLatest) > 0) npmLatest = parsed;
              }
            }
            const distLatest = parseSemver(data["dist-tags"]?.latest);
            if (distLatest && (!npmLatest || cmpSemver(distLatest, npmLatest) > 0)) {
              npmLatest = distLatest;
            }
          } else if (res.status !== 404) {
            throw new Error(`Unexpected HTTP ${res.status} querying npm registry for ${pkgName}`);
          }

          if (eventName === "push") {
            const headTags = execFileSync("git", ["tag", "--points-at", "HEAD"], { encoding: "utf8" })
              .split("\n")
              .map(parseSemver)
              .filter(Boolean)
              .map(fmtSemver);
            const publishedHeadTag = headTags.find((v) => npmVersions.has(v));
            if (publishedHeadTag) {
              console.log(`HEAD is already published as v${publishedHeadTag}; skipping.`);
              if (process.env.GITHUB_OUTPUT) {
                appendFileSync(process.env.GITHUB_OUTPUT, `skip=true\nversion=${publishedHeadTag}\n`);
              }
              process.exit(0);
            }
          }

          const gitTags = execFileSync("git", ["tag", "--list", "v*"], { encoding: "utf8" })
            .split("\n")
            .map(parseSemver)
            .filter(Boolean);

          let highestReleased = npmLatest;
          for (const t of gitTags) {
            if (!highestReleased || cmpSemver(t, highestReleased) > 0) {
              highestReleased = t;
            }
          }

          // package.json version is a repo placeholder (0.0.0). Real version is
          // derived from npm + git tags in CI and stamped only for publish.
          const pkgSemver = parseSemver(pkg.version);
          const placeholder =
            !pkgSemver || (pkgSemver[0] === 0 && pkgSemver[1] === 0 && pkgSemver[2] === 0);
          let targetSemver;
          if (!highestReleased) {
            const initialFloor = [0, 0, 1];
            targetSemver =
              !placeholder && cmpSemver(pkgSemver, initialFloor) > 0 ? pkgSemver : initialFloor;
          } else {
            const bumped = bumpSemver(highestReleased, bump);
            targetSemver =
              !placeholder && cmpSemver(pkgSemver, bumped) > 0 ? pkgSemver : bumped;
          }

          const nextVersion = fmtSemver(targetSemver);
          pkg.version = nextVersion;
          writeFileSync(pkgPath, `${JSON.stringify(pkg, null, 2)}\n`);
          copyFileSync("README.md", "packages/agentcue/README.md");

          console.log(
            `Resolved release version: ${nextVersion} (previous: ${highestReleased ? fmtSemver(highestReleased) : "none"})`
          );
          if (process.env.GITHUB_OUTPUT) {
            appendFileSync(process.env.GITHUB_OUTPUT, `skip=false\nversion=${nextVersion}\n`);
          }
          EOF

      - name: Build and run test suite
        if: steps.version.outputs.skip != 'true'
        run: |
          (cd packages/agentcue && bun scripts/build.mjs)
          (cd apps/web && bun scripts/build.mjs)
          (cd examples/vite-react && bunx tsc --noEmit && bunx vite build)
          (cd packages/agentcue && bun test)

      - name: Publish to npm
        if: steps.version.outputs.skip != 'true'
        working-directory: packages/agentcue
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_CONFIG_TOKEN:-}" ]; then
            echo "::error::Missing NPM_TOKEN secret. Add NPM_TOKEN in Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          bun publish --access public

      - name: Create Git Tag and GitHub Release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists."
          else
            gh release create "$TAG" \
              --target "${{ github.sha }}" \
              --title "$TAG" \
              --generate-notes
          fi
