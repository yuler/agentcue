name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump when package is already published on npm"
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Publish agentcue
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        !contains(github.event.workflow_run.head_commit.message, '[skip release]')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve release plan
        id: version
        env:
          INPUT_BUMP: ${{ inputs.bump || 'patch' }}
        run: node .github/scripts/resolve-release.mjs

      - name: Setup toolchain
        if: steps.version.outputs.skip != 'true'
        uses: ./.github/actions/setup
        with:
          registry-url: "https://registry.npmjs.org"

      - name: Build and test agentcue
        if: steps.version.outputs.skip != 'true'
        run: mise run agentcue:test

      - name: Publish to npm
        if: steps.version.outputs.skip != 'true'
        working-directory: packages/agentcue
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_CONFIG_TOKEN:-}" ]; then
            echo "::error::Missing NPM_TOKEN secret. Add NPM_TOKEN in Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          bun publish --access public

      - name: Create Git Tag and GitHub Release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${VERSION}"
          TARGET_SHA="$(git rev-parse HEAD)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists."
          else
            gh release create "$TAG" \
              --target "$TARGET_SHA" \
              --title "$TAG" \
              --generate-notes
          fi
