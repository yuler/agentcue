[tools]
bun = "1.4.4"

# ─── Workspace ───────────────────────────────────────────────────────────────

[tasks.setup]
description = "Install workspace dependencies and build all targets"
run = ["bun install", "mise run build"]

[tasks.dev]
description = "Start core dev environment (cli, extension, web)"
depends = ["{cli,extension,web}:dev"]

[tasks.build]
description = "Build all packages, apps, and examples"
depends = ["*:build"]

[tasks.test]
description = "Run workspace test suite"
depends = ["*:test"]

[tasks.check]
description = "Build all targets and run test suite"
depends = ["build", "test"]

[tasks.clean]
description = "Remove build artifacts across workspaces"
run = "rm -rf packages/*/dist apps/*/dist examples/*/dist"

# ─── Core: cli ───────────────────────────────────────────────────────────────

[tasks."cli:build:client"]
description = "Build only the browser overlay bundle (dist/client.js)"
hide = true
dir = "packages/agentcue"
run = "bun scripts/build.mjs --client-only"

[tasks."cli:build"]
description = "Build agentcue CLI, library, Vite plugin, and browser overlay"
dir = "packages/agentcue"
run = "bun scripts/build.mjs"

[tasks."cli:dev"]
description = "Watch agentcue bundles and run local CLI bridge (:4318)"
depends = ["cli:build"]
dir = "packages/agentcue"
run = "bun scripts/build.mjs --watch --no-initial --serve"

[tasks."cli:test"]
description = "Run agentcue unit and server integration tests"
depends = ["cli:build"]
run = "bun test packages/agentcue"

# ─── Core: extension ─────────────────────────────────────────────────────────

[tasks."extension:build"]
description = "Build @agentcue/extension MV3 unpacked bundle and zip archive"
dir = "packages/extension"
run = "bun scripts/build.mjs"

[tasks."extension:dev"]
description = "Watch and rebuild @agentcue/extension on source changes"
depends = ["extension:build"]
dir = "packages/extension"
run = "bun scripts/build.mjs --watch --no-initial"

[tasks."extension:test"]
description = "Run @agentcue/extension protocol, security boundary, and build tests"
depends = ["extension:build"]
run = "bun test packages/extension"

# ─── Core: web ───────────────────────────────────────────────────────────────

[tasks."web:build"]
description = "Build @agentcue/web showcase"
depends = ["cli:build:client"]
dir = "apps/web"
run = "bun scripts/build.mjs"

[tasks."web:dev"]
description = "Start @agentcue/web showcase in dev mode (:4319)"
depends = ["web:build"]
dir = "apps/web"
run = "bun scripts/serve.mjs --watch"

# ─── Examples ────────────────────────────────────────────────────────────────

[tasks."example:dev"]
description = "Start unified examples server (:4320 — /html, /vite-react/)"
depends = ["cli:build"]
run = "bun examples/dev.mjs"

[tasks."example:build"]
description = "Typecheck and build playground examples"
depends = ["cli:build"]
dir = "examples/vite-react"
run = "bunx tsc --noEmit && bunx vite build"
